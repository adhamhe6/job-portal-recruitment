name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint, types, migrations, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talentlens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/talentlens_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/pyproject.toml
      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check app tests scripts
      - name: Ruff (format)
        run: ruff format --check app tests scripts
      - name: Mypy
        run: mypy app
      - name: Migrations apply from an empty database and match the models
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic check
      - name: Tests (unit + integration + API end-to-end)
        run: pytest --cov=app --cov-report=term-missing:skip-covered --cov-report=xml -q
      - name: Matching evaluation report is reproducible
        run: python -m app.matching.eval > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend · lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck
      - name: Unit / component tests
        run: npm test
      - name: Build
        run: npm run build

  docker-e2e:
    name: Docker · build, full-stack smoke & browser E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" .env
      - name: Build images
        run: docker compose build
      - name: Start stack (migrate + demo data → api, worker, web)
        run: docker compose up -d --wait --wait-timeout 420
      - name: Smoke test through nginx
        run: |
          curl -fsS http://localhost:8080/health/ready
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/v1/auth/login -H 'content-type: application/json' \
            -d '{"email":"recruiter@demo.example","password":"DemoPass123!"}' | jq -r .access_token)
          curl -fsS http://localhost:8080/api/v1/jobs -H "Authorization: Bearer $TOKEN" | jq '.total'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser E2E (Playwright: UI → API → PostgreSQL/Redis/worker → UI)
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
      - name: Service logs
        if: always()
        run: docker compose logs --no-color --tail=200
