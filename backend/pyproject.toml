[project]
name = "talentlens-backend"
version = "1.0.0"
description = "TalentLens — job portal & recruitment management API with semantic candidate-job matching"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0,<6",
    "arq>=0.26",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "wordllama>=0.3.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Optional heavier embedding backend (requires downloading a model from the HuggingFace hub).
st = ["sentence-transformers>=3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF", "N", "C4", "PT", "RET"]
ignore = [
    "B008",    # FastAPI Depends() in defaults is idiomatic
    "S101",    # asserts are fine in tests
    "RUF012",
    "S311",    # random is used for demo seed data, not crypto
    "E501",    # long lines are handled by the formatter
    "RUF001", "RUF002", "RUF003",  # intentional typography in docs/strings
    "N812", "N818", "N801", "N802", "PT012", "RUF043", "SIM102", "S105",  # style conventions the codebase deliberately deviates from
    "RET504",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "PT018", "PT011", "E402", "S608"]
"app/scripts/**" = ["S105", "S106", "S608"]
"scripts/**" = ["S105", "S106", "S608", "S101", "N802", "C408", "RUF007", "PT018", "F841"]
"app/matching/eval/**" = ["S105"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: requires PostgreSQL and Redis",
    "e2e: end-to-end API workflows",
]

[tool.coverage.run]
omit = ["app/scripts/*"]
