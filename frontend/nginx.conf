# SPA + same-origin reverse proxy to the FastAPI service (no CORS needed; the refresh cookie is SameSite=Strict).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Résumé uploads (API enforces its own limit; keep the proxy limit just above it).
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml font/woff2;

    # add_header in a location replaces inherited ones, so the security headers are included per SPA location.
    # Proxied API/Swagger responses carry the API's own headers (Swagger UI needs CDN assets a strict CSP blocks).

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Resolve the API through Docker's embedded DNS on every (cached 10 s) lookup instead of once at start-up, so a
    # recreated or restarted api container is picked up without restarting nginx (no 502s after a redeploy).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/(api/|docs|redoc|openapi\.json|health) {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }

    # Fingerprinted build assets: cache for a year.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Un-hashed static files (favicon, theme bootstrap): revalidate.
    location ~* \.(?:svg|ico|png|jpg|webp|js|txt)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # SPA fallback: index.html is never cached so new deploys are picked up immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
